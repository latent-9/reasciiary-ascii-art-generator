<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Image to ASCII art generator | Reasciiary</title>
    <meta
      name="description"
      content="Reasciiary turns your images into lit 3D ASCII art and animated GIFs. Six tools and one exporter in a small, terminal-style desktop app."
    />
    <meta name="author" content="latent-9" />
    <meta name="theme-color" content="#121314" />

    <!-- The app icon, so the page carries the same mark as the window it stands
         in for. -->
    <link rel="icon" type="image/png" href="/reasciiary.png" />
    <link rel="apple-touch-icon" href="/reasciiary.png" />

    <!-- Link previews. The paths stay relative until the page has a home to make
         them absolute against. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Image to ASCII art generator | Reasciiary" />
    <meta property="og:description" content="Turn your images into lit 3D ASCII art and animated GIFs." />
    <meta property="og:image" content="/reasciiary.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Image to ASCII art generator | Reasciiary" />
    <meta name="twitter:description" content="Turn your images into lit 3D ASCII art and animated GIFs." />
    <meta name="twitter:image" content="/reasciiary.png" />

    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- The window's own title bar is drawn by the app, so the toolbar is what
         the traffic lights sit in and what the window is dragged by. -->
    <header class="toolbar" data-tauri-drag-region>
      <div class="lights" data-tauri-drag-region></div>
      <div class="picker" id="tools"></div>
      <div class="spacer" data-tauri-drag-region></div>
      <button class="chip" id="open">Open…</button>
      <div class="themes" id="themes"></div>
      <label class="tint" for="tint" title="The colour the drawing comes out in">
        <input type="color" id="tint" value="#e6e6e6" />
      </label>
      <button class="chip filled" id="render">Render</button>
    </header>

    <div class="app">
      <!-- The options sit on the leading edge, the way the editor this lives
           beside keeps its sidebar — the tool picker in the toolbar chooses
           what is shown, and the panel below it is where that tool's controls
           land, with the stage to its right. -->
      <aside class="inspector">
        <p class="blurb" id="blurb"></p>
        <div class="options" id="options"></div>
      </aside>

      <main class="stage">
        <!-- Both panes are here from the start, and a tool lands its frames in
             one or the other: characters in the `pre`, pixels on the `canvas`.
             Which one is wanted is a fact about the tool, not about the markup,
             so the markup carries both and the script hides one. -->
        <div class="screen">
          <pre id="preview"></pre>
          <canvas id="picture" hidden></canvas>
        </div>
      </main>
    </div>

    <footer class="statusbar">
      <span class="file" id="file"></span>
      <span class="spacer"></span>
      <span class="status" id="status"></span>
      <span class="hint" id="hint"></span>
    </footer>
  </body>
</html>
