<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asciiary</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- The window's own title bar is drawn by the app, so the toolbar is what
         the traffic lights sit in and what the window is dragged by. -->
    <header class="toolbar" data-tauri-drag-region>
      <div class="lights" data-tauri-drag-region></div>
      <div class="picker" id="tools"></div>
      <div class="spacer" data-tauri-drag-region></div>
      <button class="chip" id="open">Open…</button>
      <div class="themes" id="themes"></div>
      <label class="tint" for="tint" title="The colour the drawing comes out in">
        <input type="color" id="tint" value="#0b0b0b" />
      </label>
      <button class="chip filled" id="render">Render</button>
    </header>

    <div class="app">
      <main class="stage">
        <div class="screen"><pre id="preview"></pre></div>
      </main>

      <aside class="inspector">
        <p class="blurb" id="blurb"></p>
        <div class="options" id="options"></div>
      </aside>
    </div>

    <footer class="statusbar">
      <span class="file" id="file"></span>
      <span class="spacer"></span>
      <span class="status" id="status"></span>
      <span class="hint" id="hint"></span>
    </footer>
  </body>
</html>
