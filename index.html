<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asciiary</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="titlebar" data-tauri-drag-region></div>

    <div class="app">
      <aside class="panel">
        <div class="brand">asciiary</div>

        <div class="panel-scroll">
        <section>
          <h2>Drawing</h2>
          <div class="segmented">
            <button id="open">Open…</button>
            <button id="sample">Sample</button>
          </div>
          <div class="file" id="file">no drawing yet</div>
        </section>

        <section>
          <h2>Solid</h2>
          <label>Depth<output id="depth-value">8</output></label>
          <input type="range" id="depth" min="1" max="40" step="1" value="8" />
          <label>Detail<output id="detail-value">160</output></label>
          <input type="range" id="detail" min="60" max="240" step="4" value="160" />
        </section>

        <section>
          <h2>Motion</h2>
          <div class="segmented" id="motion">
            <button data-motion="spin" class="on">Spin</button>
            <button data-motion="still">Still</button>
          </div>
          <label>Turns<output id="turns-value">2</output></label>
          <input type="range" id="turns" min="1" max="8" step="1" value="2" />
          <label>Seconds<output id="seconds-value">4</output></label>
          <input type="range" id="seconds" min="1" max="30" step="1" value="4" />
        </section>

        <section>
          <h2>Format</h2>
          <div class="segmented" id="format">
            <button data-format="mp4" class="on">MP4</button>
            <button data-format="gif">GIF</button>
            <button data-format="png">PNG</button>
            <button data-format="txt">TXT</button>
          </div>
          <div class="hint" id="hint"></div>
        </section>
        </div>

        <div class="panel-footer">
          <button class="wide primary" id="render">Render</button>
          <div class="status" id="status"></div>
        </div>
      </aside>

      <main class="stage">
        <div class="bar">
          <div class="themes" id="themes"></div>
          <div class="hint" id="view">drag to turn · scroll to zoom · double-click to reset</div>
        </div>
        <div class="screen"><pre id="preview"></pre></div>
      </main>
    </div>
  </body>
</html>
