[package]
name = "reasciiary-desktop"
version = "1.0.0"
description = "Six tools and one exporter for making a picture into another picture"
authors = ["latent-9"]
license = "MIT"
edition = "2021"
# Two binaries ship from here: the window and the `reasciiary` command line. The
# short name belongs to the one that gets typed, so the window's takes a suffix —
# a package named `reasciiary` would name its own binary that and collide.
# Without this, `cargo run` (and so `tauri dev`) cannot pick one.
default-run = "reasciiary-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reasciiary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
image = "0.25.10"
rayon = "1.12.0"
tiny-skia = "0.12.0"
noise = "0.9.0"
fontdue = "0.9.4"
rand = "0.10.2"
gif = "0.14.2"
thiserror = "2.0.19"
tauri-plugin-dialog = "2.7.2"

# `tauri dev` runs a debug build, and this app spends its time in tight float
# loops over a few hundred thousand samples a frame. Unoptimised those run about
# thirty times slower than the release build — slower than the preview's own
# frame interval, so the window skipped frames and a spin came out juddering.
# The renderer is not what anybody is here to step through in a debugger, and
# `2` costs a few seconds of compile time to make the app usable while it is
# being worked on.
[profile.dev]
opt-level = 2

# Dependencies are compiled once and then cached, so there is nothing to trade:
# take the fastest build of them available.
[profile.dev.package."*"]
opt-level = 3

