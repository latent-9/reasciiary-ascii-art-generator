<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Apple squircle -->
    <path id="sq" d="M 944.00 512.00 L 943.97 597.55 L 943.89 624.88 L 943.76 644.74 L 943.58 660.91 L 943.34 674.78 L 943.05 687.06 L 942.71 698.14 L 942.31 708.29 L 941.86 717.69 L 941.36 726.46 L 940.81 734.70 L 940.20 742.48 L 939.54 749.86 L 938.82 756.88 L 938.05 763.58 L 937.23 770.00 L 936.35 776.15 L 935.42 782.07 L 934.43 787.77 L 933.38 793.26 L 932.29 798.56 L 931.13 803.68 L 929.92 808.64 L 928.65 813.45 L 927.33 818.10 L 925.95 822.61 L 924.51 826.99 L 923.02 831.25 L 921.46 835.38 L 919.85 839.39 L 918.17 843.30 L 916.44 847.09 L 914.64 850.79 L 912.79 854.38 L 910.87 857.88 L 908.89 861.28 L 906.84 864.59 L 904.73 867.81 L 902.56 870.95 L 900.32 874.00 L 898.01 876.97 L 895.63 879.86 L 893.18 882.68 L 890.67 885.42 L 888.08 888.08 L 885.42 890.67 L 882.68 893.18 L 879.86 895.63 L 876.97 898.01 L 874.00 900.32 L 870.95 902.56 L 867.81 904.73 L 864.59 906.84 L 861.28 908.89 L 857.88 910.87 L 854.38 912.79 L 850.79 914.64 L 847.09 916.44 L 843.30 918.17 L 839.39 919.85 L 835.38 921.46 L 831.25 923.02 L 826.99 924.51 L 822.61 925.95 L 818.10 927.33 L 813.45 928.65 L 808.64 929.92 L 803.68 931.13 L 798.56 932.29 L 793.26 933.38 L 787.77 934.43 L 782.07 935.42 L 776.15 936.35 L 770.00 937.23 L 763.58 938.05 L 756.88 938.82 L 749.86 939.54 L 742.48 940.20 L 734.70 940.81 L 726.46 941.36 L 717.69 941.86 L 708.29 942.31 L 698.14 942.71 L 687.06 943.05 L 674.78 943.34 L 660.91 943.58 L 644.74 943.76 L 624.88 943.89 L 597.55 943.97 L 512.00 944.00 L 426.45 943.97 L 399.12 943.89 L 379.26 943.76 L 363.09 943.58 L 349.22 943.34 L 336.94 943.05 L 325.86 942.71 L 315.71 942.31 L 306.31 941.86 L 297.54 941.36 L 289.30 940.81 L 281.52 940.20 L 274.14 939.54 L 267.12 938.82 L 260.42 938.05 L 254.00 937.23 L 247.85 936.35 L 241.93 935.42 L 236.23 934.43 L 230.74 933.38 L 225.44 932.29 L 220.32 931.13 L 215.36 929.92 L 210.55 928.65 L 205.90 927.33 L 201.39 925.95 L 197.01 924.51 L 192.75 923.02 L 188.62 921.46 L 184.61 919.85 L 180.70 918.17 L 176.91 916.44 L 173.21 914.64 L 169.62 912.79 L 166.12 910.87 L 162.72 908.89 L 159.41 906.84 L 156.19 904.73 L 153.05 902.56 L 150.00 900.32 L 147.03 898.01 L 144.14 895.63 L 141.32 893.18 L 138.58 890.67 L 135.92 888.08 L 133.33 885.42 L 130.82 882.68 L 128.37 879.86 L 125.99 876.97 L 123.68 874.00 L 121.44 870.95 L 119.27 867.81 L 117.16 864.59 L 115.11 861.28 L 113.13 857.88 L 111.21 854.38 L 109.36 850.79 L 107.56 847.09 L 105.83 843.30 L 104.15 839.39 L 102.54 835.38 L 100.98 831.25 L 99.49 826.99 L 98.05 822.61 L 96.67 818.10 L 95.35 813.45 L 94.08 808.64 L 92.87 803.68 L 91.71 798.56 L 90.62 793.26 L 89.57 787.77 L 88.58 782.07 L 87.65 776.15 L 86.77 770.00 L 85.95 763.58 L 85.18 756.88 L 84.46 749.86 L 83.80 742.48 L 83.19 734.70 L 82.64 726.46 L 82.14 717.69 L 81.69 708.29 L 81.29 698.14 L 80.95 687.06 L 80.66 674.78 L 80.42 660.91 L 80.24 644.74 L 80.11 624.88 L 80.03 597.55 L 80.00 512.00 L 80.03 426.45 L 80.11 399.12 L 80.24 379.26 L 80.42 363.09 L 80.66 349.22 L 80.95 336.94 L 81.29 325.86 L 81.69 315.71 L 82.14 306.31 L 82.64 297.54 L 83.19 289.30 L 83.80 281.52 L 84.46 274.14 L 85.18 267.12 L 85.95 260.42 L 86.77 254.00 L 87.65 247.85 L 88.58 241.93 L 89.57 236.23 L 90.62 230.74 L 91.71 225.44 L 92.87 220.32 L 94.08 215.36 L 95.35 210.55 L 96.67 205.90 L 98.05 201.39 L 99.49 197.01 L 100.98 192.75 L 102.54 188.62 L 104.15 184.61 L 105.83 180.70 L 107.56 176.91 L 109.36 173.21 L 111.21 169.62 L 113.13 166.12 L 115.11 162.72 L 117.16 159.41 L 119.27 156.19 L 121.44 153.05 L 123.68 150.00 L 125.99 147.03 L 128.37 144.14 L 130.82 141.32 L 133.33 138.58 L 135.92 135.92 L 138.58 133.33 L 141.32 130.82 L 144.14 128.37 L 147.03 125.99 L 150.00 123.68 L 153.05 121.44 L 156.19 119.27 L 159.41 117.16 L 162.72 115.11 L 166.12 113.13 L 169.62 111.21 L 173.21 109.36 L 176.91 107.56 L 180.70 105.83 L 184.61 104.15 L 188.62 102.54 L 192.75 100.98 L 197.01 99.49 L 201.39 98.05 L 205.90 96.67 L 210.55 95.35 L 215.36 94.08 L 220.32 92.87 L 225.44 91.71 L 230.74 90.62 L 236.23 89.57 L 241.93 88.58 L 247.85 87.65 L 254.00 86.77 L 260.42 85.95 L 267.12 85.18 L 274.14 84.46 L 281.52 83.80 L 289.30 83.19 L 297.54 82.64 L 306.31 82.14 L 315.71 81.69 L 325.86 81.29 L 336.94 80.95 L 349.22 80.66 L 363.09 80.42 L 379.26 80.24 L 399.12 80.11 L 426.45 80.03 L 512.00 80.00 L 597.55 80.03 L 624.88 80.11 L 644.74 80.24 L 660.91 80.42 L 674.78 80.66 L 687.06 80.95 L 698.14 81.29 L 708.29 81.69 L 717.69 82.14 L 726.46 82.64 L 734.70 83.19 L 742.48 83.80 L 749.86 84.46 L 756.88 85.18 L 763.58 85.95 L 770.00 86.77 L 776.15 87.65 L 782.07 88.58 L 787.77 89.57 L 793.26 90.62 L 798.56 91.71 L 803.68 92.87 L 808.64 94.08 L 813.45 95.35 L 818.10 96.67 L 822.61 98.05 L 826.99 99.49 L 831.25 100.98 L 835.38 102.54 L 839.39 104.15 L 843.30 105.83 L 847.09 107.56 L 850.79 109.36 L 854.38 111.21 L 857.88 113.13 L 861.28 115.11 L 864.59 117.16 L 867.81 119.27 L 870.95 121.44 L 874.00 123.68 L 876.97 125.99 L 879.86 128.37 L 882.68 130.82 L 885.42 133.33 L 888.08 135.92 L 890.67 138.58 L 893.18 141.32 L 895.63 144.14 L 898.01 147.03 L 900.32 150.00 L 902.56 153.05 L 904.73 156.19 L 906.84 159.41 L 908.89 162.72 L 910.87 166.12 L 912.79 169.62 L 914.64 173.21 L 916.44 176.91 L 918.17 180.70 L 919.85 184.61 L 921.46 188.62 L 923.02 192.75 L 924.51 197.01 L 925.95 201.39 L 927.33 205.90 L 928.65 210.55 L 929.92 215.36 L 931.13 220.32 L 932.29 225.44 L 933.38 230.74 L 934.43 236.23 L 935.42 241.93 L 936.35 247.85 L 937.23 254.00 L 938.05 260.42 L 938.82 267.12 L 939.54 274.14 L 940.20 281.52 L 940.81 289.30 L 941.36 297.54 L 941.86 306.31 L 942.31 315.71 L 942.71 325.86 L 943.05 336.94 L 943.34 349.22 L 943.58 363.09 L 943.76 379.26 L 943.89 399.12 L 943.97 426.45 Z"/>

    <clipPath id="clip"><use href="#sq"/></clipPath>

    <!-- deep dark glass body -->
    <linearGradient id="body" x1="0" y1="80" x2="0" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#2a2f39"/>
      <stop offset="0.16" stop-color="#1b1f27"/>
      <stop offset="0.5"  stop-color="#101319"/>
      <stop offset="0.82" stop-color="#080a0e"/>
      <stop offset="1"    stop-color="#020304"/>
    </linearGradient>

    <!-- lower-corner vignette to make the slab feel round & heavy -->
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.78"/>
    </radialGradient>

    <!-- soft top inner light -->
    <linearGradient id="toplight" x1="0" y1="80" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#8fb4ff" stop-opacity="0.22"/>
      <stop offset="1"   stop-color="#8fb4ff" stop-opacity="0"/>
    </linearGradient>

    <!-- upper-left specular bloom -->
    <radialGradient id="bloom" cx="0.34" cy="0.26" r="0.5">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- glass sheen sweeping the top half -->
    <linearGradient id="sheen" x1="0" y1="80" x2="0" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- bright refractive rim gradient (brightest at top) -->
    <linearGradient id="rim" x1="0" y1="80" x2="0" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#cfe0ff" stop-opacity="0.4"/>
      <stop offset="0.6"  stop-color="#7d8aa5" stop-opacity="0.16"/>
      <stop offset="0.85" stop-color="#aab6d0" stop-opacity="0.28"/>
      <stop offset="1"    stop-color="#e8eefc" stop-opacity="0.5"/>
    </linearGradient>

    <!-- soft refractive light-leak along the bottom rim (glass thickness) -->
    <linearGradient id="botrim" x1="0" y1="600" x2="0" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#cfe0ff" stop-opacity="0"/>
      <stop offset="0.7"  stop-color="#cfe0ff" stop-opacity="0"/>
      <stop offset="1"    stop-color="#dbe6ff" stop-opacity="0.62"/>
    </linearGradient>

    <!-- mint prompt gradient -->
    <linearGradient id="mint" x1="0" y1="470" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7bffc4"/>
      <stop offset="1" stop-color="#25d982"/>
    </linearGradient>

    <!-- brilliant top-edge highlight: strong at very top, gone by the sides -->
    <linearGradient id="topedge" x1="0" y1="80" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#eaf1ff" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softglow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- REAL glass lighting: light a blurred RING so the specular rides only the bezel rim -->
    <filter id="glassspec" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="ridge"/>
      <feSpecularLighting in="ridge" surfaceScale="9" specularConstant="1.0"
                          specularExponent="20" lighting-color="#eaf1ff" result="spec">
        <fePointLight x="300" y="170" z="380"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip"/>
    </filter>

    <!-- crisp top specular streak -->
    <radialGradient id="streak" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="dropshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- drop shadow just outside the squircle -->
  <g transform="translate(0,14)" opacity="0.45">
    <use href="#sq" fill="#000000" filter="url(#dropshadow)"/>
  </g>

  <!-- glass body, everything clipped to the squircle -->
  <g clip-path="url(#clip)">
    <use href="#sq" fill="url(#body)"/>

    <!-- soft top inner light -->
    <rect x="80" y="80" width="864" height="500" fill="url(#toplight)"/>

    <!-- upper-left specular bloom -->
    <rect x="80" y="80" width="864" height="864" fill="url(#bloom)" filter="url(#blur20)"/>

    <!-- prompt: mint ">" + white "Re", absolute-positioned monospace glyphs -->
    <!-- green phosphor glow behind the caret only -->
    <text x="244" y="610" text-anchor="start" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-weight="700" font-size="290" fill="#37f09a" filter="url(#softglow)" opacity="0.6">&gt;</text>
    <text x="244" y="610" text-anchor="start" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-weight="700" font-size="290" fill="url(#mint)">&gt;</text>
    <text x="432" y="610" text-anchor="start" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-weight="700" font-size="290" fill="#f4f7ff">Re</text>

    <!-- lower-corner vignette on top of everything -->
    <rect x="80" y="80" width="864" height="864" fill="url(#vig)"/>

    <!-- glass sheen over the top half (under-glass feel) -->
    <rect x="80" y="80" width="864" height="560" fill="url(#sheen)"/>

    <!-- broad soft top reflection hugging the top rim (reads as glass, not a scratch) -->
    <g transform="translate(500,214) rotate(-6)" opacity="0.5">
      <ellipse cx="0" cy="0" rx="330" ry="50" fill="url(#streak)" filter="url(#softglow2)"/>
    </g>
    <g transform="translate(452,201) rotate(-6)" opacity="0.55">
      <ellipse cx="0" cy="0" rx="205" ry="17" fill="url(#streak)" filter="url(#softglow2)"/>
    </g>

    <!-- REAL feSpecularLighting glass bezel highlight (rim only) -->
    <use href="#sq" fill="none" stroke="#ffffff" stroke-width="46" filter="url(#glassspec)" opacity="0.85"/>

    <!-- faint inner rim glow for thickness -->
    <use href="#sq" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="18" filter="url(#softglow)"/>
    <!-- soft refractive light-leak along the bottom rim (glass thickness) -->
    <use href="#sq" fill="none" stroke="url(#botrim)" stroke-width="8" filter="url(#softglow2)"/>
    <!-- bright refractive rim, clipped so it sits crisply inside the edge -->
    <use href="#sq" fill="none" stroke="url(#rim)" stroke-width="7"/>
    <!-- brilliant top edge highlight -->
    <use href="#sq" fill="none" stroke="url(#topedge)" stroke-width="4" filter="url(#softglow2)"/>
  </g>
</svg>
